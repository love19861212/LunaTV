name: Build Selene Android Short Drama
on:
  push:
    branches: [selene-android-shortdrama]
    paths:
      - '.github/workflows/selene-android-shortdrama.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: selene-android-shortdrama
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager 'ndk;29.0.14033849'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Download pinned Selene source and apply Android changes
        run: |
          mkdir selene-source
          curl --fail --location --retry 3 https://codeload.github.com/MoonTechLab/Selene-Source/tar.gz/9ad75545be1ef112ba9a44a8d1022219aef4a597 | tar -xz --strip-components=1 -C selene-source
          echo  | base64 --decode > shortdrama.patch
          cd selene-source
          git apply --check --ignore-space-change ../shortdrama.patch
          git apply --ignore-space-change ../shortdrama.patch
      - name: Install dependencies
        working-directory: selene-source
        run: flutter pub get
      - name: Analyze Android changes
        working-directory: selene-source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/short_drama_screen.dart lib/screens/home_screen.dart lib/widgets/main_layout.dart
      - name: Build Android APK
        working-directory: selene-source
        run: flutter build apk --release
      - name: Prepare installation file
        run: |
          mkdir -p release-output
          cp selene-source/build/app/outputs/flutter-apk/app-release.apk release-output/Selene-Android-ShortDrama.apk
          cd release-output
          sha256sum Selene-Android-ShortDrama.apk > Selene-Android-ShortDrama.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Selene-Android-ShortDrama
          path: release-output/*
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="selene-android-shortdrama-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-output/* --target "$GITHUB_SHA" --title "Selene 安卓短剧版 ${GITHUB_RUN_NUMBER}" --notes "安卓客户端新增短剧分类浏览、搜索、分页和选集播放，连接 LunaTV 后端。基于 Selene-Source 9ad7554，仅安卓显示新增入口。通过云端类型分析及 APK 构建，尚未做真机及线上播放验证。使用项目默认调试签名，覆盖原安装版本可能需要相同签名。"
